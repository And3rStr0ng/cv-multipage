<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Anderson Gutierrez">
    <meta name="description" content="Ponte en contacto con Anderson Gutierrez para consultas, propuestas o colaboraciones en desarrollo web.">
    <meta name="keywords" content="Contacto, Formulario, Mensaje, Email, Anderson Gutierrez">

    <!-- Open Graph -->
    <meta property="og:title" content="Contacto | Cv-Anderson Gutierrez">
    <meta property="og:description" content="Formulario de contacto directo con Anderson Gutierrez.">
    <meta property="og:type" content="website">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Hoja de estilos compartida -->
    <link rel="stylesheet" href="style.css">

    <title>Contacto | Cv-Anderson Gutierrez</title>
</head>

<body>

    <!-- Checkbox oculto para el modo oscuro -->
    <input type="checkbox" id="dark-toggle" class="dark-checkbox">

    <!-- HEADER / NAVEGACIÓN UNIFICADA -->
    <header class="site-header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                <strong>Anderson Gutierrez</strong>
            </a>
            
            <div class="header-right">
                <nav class="nav-links">
                    <a href="index.html">inicio</a> /
                    <a href="proyectos.html">Proyectos</a> /
                    <a href="articulos.html">Artículos</a> /
                    <a href="contacto.html" class="active">Contacto</a>
                </nav>

                <!-- Botón de cambio de tema -->
                <label for="dark-toggle" class="theme-btn" aria-label="Cambiar modo oscuro"></label>
            </div>
        </div>
    </header>

    <main>
        <!-- Sección Hero -->
        <section class="hero-section">
            <div class="container">
                <h1>Contacto</h1>
                <p>Envíame un mensaje</p>
            </div>
        </section>

        <div class="container">
            <hr class="section-divider">
        </div>

        <!-- Formulario de contacto centrado dentro de una tarjeta -->
        <div class="container contact-container">
            <section class="card-section form-card">
                <h2>Envía una propuesta o consulta</h2>
                <p class="form-intro">¿Tienes alguna duda o proyecto en mente? Rellena el siguiente formulario y me pondré en contacto contigo.</p>

                <form action="#" method="POST" class="contact-form">

                    <div class="form-group">
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
                    </div>

                    <div class="form-group">
                        <label for="correo">Correo electrónico:</label>
                        <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Enviar Mensaje</button>

                </form>
            </section>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Anderson Gutierrez. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>

</html>
